; Pytest configuration for the LLM-Assisted IT Audit prototype.
;
; The suite is hermetic by construction: tests/conftest.py redirects the database and
; every writable directory into a temporary tree before app.config is first imported,
; and nothing in the suite makes a network call. See the conftest module docstring.

[pytest]
testpaths = tests
; A mistyped marker is a test that silently never runs the way it was meant to.
addopts = --strict-markers
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: takes more than roughly a second of wall clock (whole-suite evaluation runs,
        multi-mode experiments). Deselect with -m "not slow".

; Warnings are shown rather than silenced: a deprecation raised inside the application
; under test is a finding, not noise. Only the third-party ones this project cannot fix
; are filtered.
filterwarnings =
    default
    ignore::DeprecationWarning:pypdf.*
